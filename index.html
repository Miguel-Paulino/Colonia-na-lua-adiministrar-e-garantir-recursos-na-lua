<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar Industries: Colônia Selene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Lunar Industries <span>Colônia Selene</span></h1>
    <div id="dia" aria-live="polite"></div>
  </header>

  <main class="jogo">
    <aside id="recursos" aria-label="Recursos da colônia"></aside>
    <section id="palco" aria-live="polite"></section>
    <aside class="lateral">
      <h2>Rotas políticas</h2>
      <div id="rotas"></div>
      <h2>Diário de bordo</h2>
      <ul id="log"></ul>
      <button id="btnFinais" class="sec">Finais descobertos</button>
    </aside>
  </main>

  <dialog id="dlgFinais">
    <h2>Finais descobertos</h2>
    <div id="listaFinais"></div>
    <button id="fecharFinais" class="sec">Fechar</button>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
